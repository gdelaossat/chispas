<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Juego de repaso de matemáticas: recta numérica, comparación, números vecinos, euros y céntimos, problemas y medidas.">
<title>Aventura Mathe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Mapa de un archipiélago: cada tema es una isla; el juego ocurre sobre una "carta" de arena */
:root{
  --sea:#d9f1f4; --sea2:#bfe6ec; --ink:#14304a; --muted:#4f6a84; --card:#ffffff;
  --sand:#fff6dc; --sheetline:#e6d199; --red:#e2432a; --teal:#0b8a80; --purple:#7a4fd0;
  --star:#f2a900; --ok:#17864a; --bad:#d63a2f; --key:#ffffff; --keyedge:#b9cbd8;
  --display:'Baloo 2','Trebuchet MS',system-ui,sans-serif;
  --body:'Nunito','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --sea:#0b1b2a; --sea2:#11293d; --ink:#eaf3f9; --muted:#9db4c8; --card:#172c41;
    --sand:#1d3247; --sheetline:#37526c; --red:#ff7d63; --teal:#3fd0c1; --purple:#b99bff;
    --star:#ffd04d; --ok:#4fd98a; --bad:#ff7a6b; --key:#1f364c; --keyedge:#3a5670; color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --sea:#0b1b2a; --sea2:#11293d; --ink:#eaf3f9; --muted:#9db4c8; --card:#172c41;
  --sand:#1d3247; --sheetline:#37526c; --red:#ff7d63; --teal:#3fd0c1; --purple:#b99bff;
  --star:#ffd04d; --ok:#4fd98a; --bad:#ff7a6b; --key:#1f364c; --keyedge:#3a5670; color-scheme:dark;
}
*,*::before,*::after{box-sizing:border-box}
body{
  margin:0;background-color:var(--sea);
  background-image:radial-gradient(circle at 12px 12px,var(--sea2) 3px,transparent 4px),radial-gradient(circle at 36px 30px,var(--sea2) 2px,transparent 3px);
  background-size:48px 40px;color:var(--ink);font-family:var(--body);font-size:18px;line-height:1.4;font-weight:500;
  -webkit-tap-highlight-color:transparent;
}
button{font:inherit;color:inherit}
button:focus-visible,a:focus-visible{outline:3px solid var(--teal);outline-offset:2px}
.wrap{max-width:780px;margin:0 auto;padding-block:16px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.hidden{display:none !important}
h1,h2,h3{font-family:var(--display);line-height:1.05;margin:0;text-wrap:balance}
h1{font-size:clamp(34px,9vw,52px);font-weight:800}
h2{font-size:26px;font-weight:700}
#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
#fx span{position:absolute;top:-40px;animation:fall 2.6s linear forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}

/* HUD */
.hud{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.avbtn{width:64px;height:64px;border-radius:50%;border:3px solid var(--ink);padding:0;overflow:hidden;background:var(--card);cursor:pointer;flex:none}
.av{width:100%;height:100%;display:block}
.who{flex:1;min-width:150px}
.hi{font-family:var(--display);font-weight:800;font-size:26px;line-height:1}
.lvl{font-size:15px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px;margin-top:4px}
.xpbar{flex:1;max-width:140px;height:10px;border-radius:10px;background:var(--sea2);border:1.5px solid var(--ink);overflow:hidden}
.xpbar i{display:block;height:100%;background:var(--star)}
.pills{display:flex;gap:8px;flex-wrap:wrap}
.pill{background:var(--card);border:2px solid var(--ink);border-radius:30px;padding:3px 12px;font-weight:800;font-size:16px;white-space:nowrap}
button.pill{cursor:pointer}
.title{margin:22px 0 4px}
.title h1{color:var(--red)}
.title p{margin:6px 0 0;color:var(--muted);max-width:50ch}
.mascot{display:flex;align-items:flex-end;gap:10px;margin:16px 0 18px}
.masc{font-size:54px;line-height:1;background:none;border:none;cursor:pointer;padding:0;transition:transform .15s}
.masc:active{transform:scale(1.25) rotate(-8deg)}
.bubble{background:var(--card);border:2px solid var(--ink);border-radius:18px 18px 18px 4px;padding:10px 14px;font-weight:700;font-size:16px;flex:1;min-width:0}
.bubble small{display:block;color:var(--muted);font-weight:500}

/* Mapa */
.map{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:16px}
.isle{
  background:var(--sand);border:3px solid var(--ink);cursor:pointer;padding:16px 10px 12px;text-align:center;
  border-radius:44% 56% 52% 48% / 46% 44% 56% 54%;display:flex;flex-direction:column;align-items:center;gap:2px;
  box-shadow:0 6px 0 var(--c);transition:transform .12s;min-height:170px;justify-content:center
}
.isle:nth-child(even){border-radius:56% 44% 46% 54% / 52% 56% 44% 48%;transform:translateY(10px)}
.isle:active{transform:translateY(4px)}
.blob{font-size:44px;line-height:1}
.isle b{font-family:var(--display);font-size:20px;line-height:1.05;font-weight:700}
.isle small{font-size:13px;color:var(--muted);font-weight:700}
.st{font-size:20px;letter-spacing:2px;color:var(--muted)}
.st .on{color:var(--star)}
.boss{grid-column:1/-1;border-radius:30px;background:var(--ink);color:var(--sea);min-height:0;flex-direction:row;gap:14px;padding:16px;text-align:left;box-shadow:0 6px 0 var(--red);transform:none !important;margin-top:8px}
.boss .blob{font-size:56px}
.boss b{font-size:24px;color:var(--sea)}
.boss small{color:var(--sea2)}
.boss:active{translate:0 4px}
details.all{margin-top:26px;background:var(--card);border:2px solid var(--ink);border-radius:16px;padding:10px 14px}
details.all summary{cursor:pointer;font-family:var(--display);font-weight:700;font-size:20px}

/* Isla (tema) */
.bar{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.back{border:2px solid var(--ink);background:var(--card);border-radius:30px;padding:5px 14px;cursor:pointer;font-weight:800;font-size:16px}
.whead{display:flex;gap:14px;align-items:center;margin-bottom:14px}
.whead .blob{font-size:64px}
.whead h1{color:var(--c)}
.de{color:var(--purple);font-weight:800;margin:2px 0}
.learn{background:var(--sand);border:2px solid var(--sheetline);border-radius:16px;padding:16px;margin-top:18px}
.learn h2{color:var(--red);margin-bottom:8px}
.learn h3{font-size:20px;margin:14px 0 4px;color:var(--teal)}
.learn p{margin:6px 0}
.learn ul{margin:6px 0;padding-left:22px}
.learn li{margin:3px 0}
.learn .ex{background:var(--card);border-radius:12px;padding:8px 12px;margin:8px 0;font-weight:800;font-size:20px;text-align:center}
.learn .ex small{display:block;font-weight:500;font-size:15px;color:var(--muted)}
.voc{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.voc span{background:var(--card);border:1.5px solid var(--purple);border-radius:20px;padding:2px 10px;font-size:15px}
.voc b{color:var(--purple)}
.links{display:grid;gap:10px;margin-top:10px}
.link{display:flex;align-items:center;gap:12px;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 12px;text-decoration:none;color:var(--ink);box-shadow:3px 3px 0 var(--ink)}
.link .ic{font-size:28px}
.link .tx{flex:1;min-width:0}
.link b{display:block;line-height:1.15}
.link small{color:var(--muted);font-size:13px;word-break:break-all}
.link .go{font-weight:800;color:var(--teal)}

/* Juego */
.bar h2{flex:1;font-size:22px;min-width:0}
.mini{width:42px;height:42px;flex:none;border-radius:50%;overflow:hidden}
.dots{display:flex;gap:5px;flex-wrap:wrap;margin:0 0 12px}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--ink);background:var(--card)}
.dot.now{background:var(--ink)} .dot.s{background:var(--star);border-color:var(--star)}
.dot.y{background:var(--ok);border-color:var(--ok)} .dot.n{background:var(--bad);border-color:var(--bad)}
.dragon{display:flex;align-items:center;gap:12px;background:var(--ink);color:var(--sea);border-radius:16px;padding:8px 14px;margin-bottom:12px}
.dragon .dr{font-size:48px;line-height:1}
.dragon.hit .dr{animation:shake .5s}
@keyframes shake{20%{transform:translateX(-8px) rotate(-8deg)}40%{transform:translateX(8px) rotate(8deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
.hp{flex:1}
.hp b{font-family:var(--display);font-size:18px}
.hpbar{height:14px;border-radius:10px;background:var(--sea2);overflow:hidden;margin-top:2px}
.hpbar i{display:block;height:100%;background:var(--red);transition:width .4s}
.sheet{background:var(--sand);border:2px solid var(--sheetline);padding:18px 14px;border-radius:16px}
.tag{display:inline-block;font-size:14px;font-weight:800;border:2px solid var(--c,var(--teal));color:var(--c,var(--teal));border-radius:20px;padding:1px 10px;margin-bottom:8px;background:var(--card)}
.prompt{font-size:20px;margin:0 0 12px;font-weight:700}
.prompt strong{color:var(--red);font-size:24px;white-space:nowrap}
.nl{width:100%;height:auto;display:block;color:var(--ink);touch-action:manipulation}
.nl .lbl{font:700 36px var(--body);fill:currentColor}
.nl .mtxt{font:800 32px var(--body);fill:currentColor}
.nl.tap .hit{cursor:pointer}
.tapnote{text-align:center;color:var(--muted);font-size:16px;margin:6px 0 0}
.nudge{display:flex;gap:10px;justify-content:center;margin-top:8px}
.nudge .k{padding:0 14px;height:46px}
.hintbtn{border:2px dashed var(--teal);color:var(--teal);background:transparent;border-radius:20px;padding:3px 12px;font-size:15px;cursor:pointer;margin-left:6px;font-weight:800}
.ansrow{display:flex;justify-content:center;align-items:flex-start;gap:8px;margin-top:12px;flex-wrap:wrap}
.ansrow .pre,.ansrow .unit{font-size:26px;font-weight:800;line-height:58px;white-space:nowrap}
.zahl{font-size:30px}
.slotcol{display:flex;flex-direction:column;align-items:center;gap:2px}
.slotcol small{font-size:12px;color:var(--muted);font-weight:700}
.slot{min-width:96px;height:58px;border:3px double var(--ink);border-radius:12px;background:var(--card);font-size:28px;font-weight:800;cursor:pointer;padding:0 10px;display:inline-grid;place-items:center}
.slot.active{border:3px solid var(--teal);box-shadow:0 0 0 3px color-mix(in srgb,var(--teal) 30%,transparent)}
.slot.ok{border:3px solid var(--ok);color:var(--ok)} .slot.bad{border:3px solid var(--bad);color:var(--bad)}
.seq{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:6px 0}
.seq span{background:var(--card);border:2px solid var(--ink);border-radius:10px;padding:4px 12px;font-size:24px;font-weight:800}
.seq span.q{border-style:dashed;color:var(--red)}
.cmp{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin:10px 0 16px}
.big{font-size:clamp(22px,6vw,36px);font-weight:800;text-align:center}
.cmp .slot{min-width:64px;width:64px;font-size:32px;cursor:default}
.cmp .blk{width:min(31vw,230px);height:auto;display:block}
.signs{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.sign,.opt{border:2px solid var(--ink);background:var(--card);border-radius:14px;padding:8px 6px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);font-weight:800}
.sign b{display:block;font-size:34px;line-height:1}
.sign small{font-size:13px;color:var(--muted)}
.sign:disabled,.opt:disabled{cursor:default;opacity:.45;box-shadow:none}
.opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px;margin-top:10px}
.opt{font-size:20px;min-height:58px}
.opt.right{background:var(--ok);border-color:var(--ok);color:#fff;opacity:1}
.ordslots{display:flex;align-items:center;justify-content:center;gap:6px;flex-wrap:wrap;margin:6px 0 16px}
.ordslots .slot{min-width:84px;font-size:20px;height:52px}
.ordslots .op{font-size:26px;font-weight:800;color:var(--red)}
.chips{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.chip{border:2px solid var(--ink);background:var(--card);border-radius:30px;padding:8px 16px;font-size:22px;font-weight:800;cursor:pointer;box-shadow:2px 2px 0 var(--ink)}
.chip:disabled{opacity:.25;cursor:default;box-shadow:none}
.fb{min-height:28px;margin:14px 2px 0;font-size:18px;font-weight:700}
.fb.ok{color:var(--ok)} .fb.bad{color:var(--bad)} .fb.hint{color:var(--teal)}
.fb .expl{color:var(--ink);margin-top:6px;font-size:17px;font-weight:500}
.gain{background:var(--star);color:#3b2a05;border-radius:20px;padding:1px 9px;font-size:15px;margin-left:4px;white-space:nowrap}
.combo{color:var(--red);white-space:nowrap}
.miniline{max-width:520px;margin-top:6px}
.dgbox{display:inline-flex;flex-direction:column;gap:4px;margin-top:8px}
.dgrow{display:flex;gap:3px;align-items:center}
.dg{width:30px;height:38px;display:grid;place-items:center;border:1px solid var(--sheetline);background:var(--card);font-size:22px;font-weight:800}
.dg.empty{border-style:dashed;background:transparent}
.dg.hl{background:var(--red);color:#fff;border-color:var(--red)}
.dgn{font-size:13px;color:var(--muted);margin-left:8px}
.pad{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin:14px auto 0;max-width:460px}
.k.check{grid-column:span 3;background:var(--red);border-color:color-mix(in srgb,var(--red) 55%,#000);color:#fff;font-family:var(--display);font-size:21px}
.k.check.wide{grid-column:span 4}
.k{height:52px;border:2px solid var(--keyedge);border-bottom-width:4px;background:var(--key);border-radius:12px;font-size:26px;font-weight:800;cursor:pointer}
.k:active{border-bottom-width:2px;transform:translateY(2px)}
.k.small{font-size:15px}
.main{display:block;width:100%;max-width:420px;margin:16px auto 0;padding:13px;border:none;border-radius:16px;background:var(--red);color:#fff;font-family:var(--display);font-size:24px;font-weight:700;cursor:pointer;box-shadow:0 5px 0 color-mix(in srgb,var(--red) 55%,#000)}
.main:active{transform:translateY(3px);box-shadow:0 2px 0 color-mix(in srgb,var(--red) 55%,#000)}
.main.go{background:var(--teal);box-shadow:0 5px 0 color-mix(in srgb,var(--teal) 55%,#000)}
.main.alt{background:var(--card);color:var(--ink);border:2px solid var(--ink);box-shadow:0 5px 0 var(--ink)}
:root[data-theme="dark"] .k.check,:root[data-theme="dark"] .main,:root[data-theme="dark"] .opt.right{color:#06202c}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .k.check,:root:not([data-theme="light"]) .main,:root:not([data-theme="light"]) .opt.right{color:#06202c}}
.main.alt{color:var(--ink) !important}

/* Dinero */
.money{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin:6px 0}
.bill{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;width:84px;height:46px;border-radius:6px;color:#fff;font-weight:800;font-size:22px;border:2px solid rgba(0,0,0,.3);box-shadow:inset 0 0 0 3px rgba(255,255,255,.35);line-height:1}
.bill small{font-size:9px;letter-spacing:1px}
.b5{background:#71857b}.b10{background:#d24a42}.b20{background:#3771c4}.b50{background:#de7a17}.b100{background:#24904f}.b200{background:#b8930a}
.coin{display:inline-flex;flex-direction:column;align-items:center;justify-content:center;border-radius:50%;font-weight:800;font-size:14px;color:#3b2a05;line-height:1;border:2px solid rgba(0,0,0,.35)}
.coin small{font-size:9px}
.cc{background:radial-gradient(circle at 35% 30%,#eaa676,#b5642f)}
.cg{background:radial-gradient(circle at 35% 30%,#ffe680,#d7a51c)}
.s100{background:radial-gradient(circle,#dfe3e8 0 50%,#e3b93a 54%)}
.s200{background:radial-gradient(circle,#e9c24a 0 50%,#cfd5dc 54%)}
.s1{width:30px;height:30px}.s2{width:34px;height:34px}.s5{width:38px;height:38px}.s10{width:36px;height:36px}.s20{width:40px;height:40px}.s50{width:44px;height:44px}.s100{width:44px;height:44px}.s200{width:48px;height:48px}
.opt .money{pointer-events:none}
.board{background:var(--card);border:2px solid var(--ink);border-radius:12px;padding:8px 12px;margin:0 auto 10px;max-width:420px}
.board h4{margin:0 0 4px;font-family:var(--display);font-size:18px;color:var(--teal)}
.board div{display:flex;justify-content:space-between;gap:10px;font-weight:700;border-top:1px dashed var(--sheetline);padding:3px 0}
.board i{font-style:normal;color:var(--purple);font-size:14px}

/* Resultado y álbum */
.res{text-align:center;padding-top:10px}
.resav{width:110px;height:110px;margin:0 auto;border-radius:50%;overflow:hidden}
.score{font-family:var(--display);font-size:70px;font-weight:800;color:var(--red);line-height:1;margin:6px 0}
.bigst{font-size:44px;letter-spacing:6px;color:var(--muted)} .bigst .on{color:var(--star)}
.res p{max-width:44ch;margin:10px auto}
.chest{font-size:84px;background:none;border:none;cursor:pointer;animation:wob 1s infinite;line-height:1}
@keyframes wob{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(6deg) scale(1.08)}}
.prize{font-size:90px;line-height:1;animation:pop .5s}
@keyframes pop{0%{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.topics{max-width:420px;margin:14px auto;text-align:left}
.trow{display:flex;justify-content:space-between;align-items:center;border-bottom:1px dashed var(--sheetline);padding:7px 2px;gap:8px}
.trow button{border:2px solid var(--teal);color:var(--teal);background:transparent;border-radius:20px;padding:2px 10px;cursor:pointer;font-size:14px;font-weight:800}
.resbtns{display:flex;gap:10px;max-width:420px;margin:18px auto 0}
.resbtns .main{margin:0}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px;margin:12px 0 20px}
.stk{aspect-ratio:1;display:grid;place-items:center;font-size:36px;background:var(--card);border:2px solid var(--ink);border-radius:16px}
.stk.no{opacity:.45;border-style:dashed;font-size:26px}
.logros{display:grid;gap:8px}
.logro{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:8px 12px}
.logro span{font-size:30px}
.logro.no{opacity:.5;border-style:dashed}
.logro small{display:block;color:var(--muted)}

/* Avatar */
.setupgrid{display:grid;grid-template-columns:210px 1fr;gap:22px;align-items:start;margin-top:14px}
@media (max-width:600px){.setupgrid{grid-template-columns:1fr}}
.prevcol{text-align:center}
.prev{width:160px;height:160px;margin:0 auto 12px;border-radius:50%;overflow:hidden}
.namelbl{display:block;font-weight:800;margin-bottom:4px}
#nameIn{width:100%;font:inherit;font-size:22px;font-weight:800;padding:8px 12px;border:3px double var(--ink);border-radius:12px;background:var(--card);color:var(--ink);text-align:center}
.prevcol .hintbtn{margin-top:12px}
.optrow{margin-bottom:14px}
.optlbl{font-weight:800;font-size:16px;margin-bottom:5px}
.optrow .opts{display:flex;flex-wrap:wrap;gap:9px;margin:0}
.sw{width:40px;height:40px;border-radius:50%;border:2px solid var(--ink);cursor:pointer;padding:0}
.avopt{width:58px;height:58px;padding:0;border:2px solid var(--ink);border-radius:50%;background:none;cursor:pointer;overflow:hidden}
.avopt.em{font-size:28px;line-height:1;background:var(--card)}
.colh{font-size:20px;margin:16px 0 0}
.colh small{color:var(--muted);font-family:var(--body);font-size:14px;font-weight:700}
.gift{background:var(--card);border:2px dashed var(--star);border-radius:14px;padding:8px 12px;font-weight:800}
.giftst{font-size:34px;vertical-align:middle}
.tok{font-weight:800;color:var(--teal);margin:6px auto}
.isle.tabl{box-shadow:0 6px 0 var(--teal);margin-top:0}
#mC{display:block;width:100%;max-width:360px;margin:0 auto;border:3px solid var(--ink);border-radius:16px;touch-action:none;background:#8fd3f4}
.mhud{display:flex;gap:8px;justify-content:center;margin-bottom:8px}
.mctl{display:flex;gap:12px;max-width:360px;margin:10px auto 0}
.mctl .k{flex:1;height:62px;font-size:30px;touch-action:none;user-select:none;-webkit-user-select:none}

<body>
<div id="fx" aria-hidden="true"></div>
<div class="wrap">
  <section id="setup" class="hidden">
    <h1>Crea tu avatar</h1>
    <div class="setupgrid">
      <div class="prevcol">
        <div class="prev" id="setupPreview"></div>
        <label class="namelbl" for="nameIn">¿Cómo te llamas?</label>
        <input id="nameIn" maxlength="16" autocomplete="off" placeholder="Tu nombre">
        <button class="hintbtn" data-act="random">🎲 Sorpréndeme</button>
      </div>
      <div id="setupBody"></div>
    </div>
    <p class="fb bad" id="setupMsg"></p>
    <button class="main go" data-act="save">¡Listo!</button>
  </section>

  <section id="home" class="hidden">
    <div class="hud" id="hud"></div>
    <div class="title">
      <h1>Aventura Mathe</h1>
      <p>Siete islas, un dragón y todo lo que entra en el examen. Cada ronda trae retos nuevos.</p>
    </div>
    <div class="mascot"><button class="masc" data-act="joke" aria-label="Zifri el erizo: toca para un chiste">🦔</button><div class="bubble" id="bubble"></div></div>
    <div class="map" id="map"></div>
    <details class="all"><summary>📚 Todo el material de apoyo</summary><div class="links" id="allLinks"></div></details>
  </section>

  <section id="world" class="hidden"></section>

  <section id="play" class="hidden">
    <div class="bar">
      <button class="back" data-act="quit">✕ Salir</button>
      <span class="mini" id="barAv"></span>
      <h2 id="modeTitle"></h2>
      <span class="pill" id="coinCount"></span>
    </div>
    <div id="dragonBox"></div>
    <div class="dots" id="dots"></div>
    <div class="sheet">
      <div id="qarea"></div>
      <div class="fb" id="fb" aria-live="polite"></div>
    </div>
    <div class="pad hidden" id="pad"></div>
    <button class="main" id="mainBtn">Comprobar</button>
  </section>

  <section id="result" class="hidden"></section>
  <section id="album" class="hidden"></section>
  <section id="mini" class="hidden"></section>
</div>

<script>
const $ = s => document.querySelector(s);
const rnd = (a, b) => Math.floor(Math.random() * (b - a + 1)) + a;
const pick = a => a[Math.floor(Math.random() * a.length)];
const shuffle = a => { for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
const fmt = n => String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const narrow = () => window.innerWidth < 600;
const rep = (n, f) => Array.from({ length: n }, f);
const uniq = a => [...new Set(a)];
const eur = c => Math.floor(c / 100) + ',' + String(c % 100).padStart(2, '0') + ' €';
const PRAISE = ['¡Muy bien!', '¡Exacto!', '¡Eso es!', '¡Perfecto!', '¡Excelente!', '¡Súper!', '¡Toll!', '¡Sehr gut!'];
const SECTIONS = ['setup', 'home', 'world', 'play', 'result', 'album', 'mini'];
function show(id) { if (id !== 'mini') stopMini(); SECTIONS.forEach(x => $('#' + x).classList.toggle('hidden', x !== id)); window.scrollTo(0, 0); }

/* ---------- Progreso guardado ---------- */
let S = { coins: 0, xp: 0, stars: {}, stickers: [], day: '', streak: 0, maxStreak: 0, maxCombo: 0, boss: false, sound: true, tokens: 1, miniBest: 0 };
try { S = { ...S, ...(JSON.parse(localStorage.getItem('aventura-estado')) || {}) }; } catch (e) {}
const save = () => { try { localStorage.setItem('aventura-estado', JSON.stringify(S)); } catch (e) {} };

/* ---------- Sonido y confeti ---------- */
let AC = null;
function sfx(k) {
  if (!S.sound) return;
  try {
    AC = AC || new (window.AudioContext || window.webkitAudioContext)();
    const n = AC.currentTime;
    const seq = { ok: [[660, 0], [880, .09]], bad: [[200, 0]], win: [[523, 0], [659, .1], [784, .2], [1047, .3]], chest: [[784, 0], [988, .08], [1175, .16], [1568, .26]] }[k];
    seq.forEach(([f, t]) => { const o = AC.createOscillator(), g = AC.createGain(); o.type = k === 'bad' ? 'triangle' : 'sine'; o.frequency.value = f; g.gain.setValueAtTime(.12, n + t); g.gain.exponentialRampToValueAtTime(.001, n + t + .2); o.connect(g); g.connect(AC.destination); o.start(n + t); o.stop(n + t + .22); });
  } catch (e) {}
}
function confetti(set) {
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) return;
  for (let i = 0; i < 28; i++) {
    const s = document.createElement('span'); s.textContent = pick(set || ['🎉', '⭐', '✨', '🎈', '💜', '🪙']);
    s.style.left = rnd(0, 95) + '%'; s.style.animationDelay = (Math.random() * .7) + 's'; s.style.fontSize = rnd(18, 34) + 'px';
    $('#fx').appendChild(s); setTimeout(() => s.remove(), 3600);
  }
}

/* ---------- Recta numérica en SVG ---------- */
function lineSVG(o) {
  const W = 1000, m = 46, H = 175, Y = 105;
  const dx = (W - 2 * m) / o.count, X = i => m + i * dx;
  const big = o.step * (o.labelEvery || 10);
  let s = `<svg viewBox="0 0 ${W} ${H}" class="nl${o.tap ? ' tap' : ''}${o.cls ? ' ' + o.cls : ''}" role="img" aria-label="Recta numérica de ${o.start} a ${o.start + o.count * o.step}">`;
  s += `<line x1="${m - 30}" y1="${Y}" x2="${W - m + 30}" y2="${Y}" stroke="currentColor" stroke-width="4"/>`;
  s += `<polygon points="${m - 40},${Y} ${m - 20},${Y - 11} ${m - 20},${Y + 11}" fill="currentColor"/>`;
  s += `<polygon points="${W - m + 40},${Y} ${W - m + 20},${Y - 11} ${W - m + 20},${Y + 11}" fill="currentColor"/>`;
  for (let i = 0; i <= o.count; i++) {
    const v = o.start + i * o.step;
    const major = o.labelAll || v % big === 0, mid = !major && v % (big / 2) === 0;
    const h = major ? 22 : mid ? 15 : 9;
    s += `<line x1="${X(i)}" y1="${Y - h}" x2="${X(i)}" y2="${Y + h}" stroke="currentColor" stroke-width="${major ? 4 : 3}"/>`;
    if (major) s += `<text x="${X(i)}" y="${Y + 60}" text-anchor="middle" class="lbl">${v}</text>`;
  }
  if (o.hops) {
    const { from, to } = o.hops, dir = to > from ? 1 : -1;
    for (let i = from; i !== to; i += dir) {
      const x1 = X(i), x2 = X(i + dir);
      s += `<path d="M${x1} ${Y - 5} Q${(x1 + x2) / 2} ${Y - 42} ${x2} ${Y - 5}" fill="none" stroke="var(--teal)" stroke-width="3.5"/>`;
    }
  }
  (o.marks || []).forEach(k => {
    const x = X(k.pos);
    s += `<g style="color:${k.color}"><line x1="${x}" y1="${k.text ? 44 : 20}" x2="${x}" y2="${Y - 32}" stroke="currentColor" stroke-width="5"/>`;
    s += `<polygon points="${x - 12},${Y - 36} ${x + 12},${Y - 36} ${x},${Y - 12}" fill="currentColor"/>`;
    if (k.text !== undefined) s += `<rect x="${x - 50}" y="2" width="100" height="42" rx="9" fill="var(--card)" stroke="currentColor" stroke-width="3"/><text x="${x}" y="34" text-anchor="middle" class="mtxt">${k.text}</text>`;
    s += `</g>`;
  });
  if (o.tap) s += `<rect class="hit" x="0" y="0" width="${W}" height="${H}" fill="transparent"/>`;
  return s + `</svg>`;
}
const nearestLabel = q => {
  const ti = (q.target - q.start) / q.step, lo = Math.floor(ti / 10) * 10;
  return (ti - lo <= 5) ? lo : lo + 10;
};


/* ---------- Dibujos: dinero, bloques y regla ---------- */
function moneyHTML(items) {
  return '<div class="money">' + items.map(v => v >= 500
    ? `<span class="bill b${v / 100}">${v / 100}<small>EURO</small></span>`
    : `<span class="coin ${v >= 100 ? '' : v >= 10 ? 'cg' : 'cc'} s${v}">${v >= 100 ? v / 100 + '€' : v}${v >= 100 ? '' : '<small>ct</small>'}</span>`).join('') + '</div>';
}
function moneySet() {
  const items = [];
  rep(rnd(1, 3), () => items.push(pick([500, 500, 1000, 1000, 2000, 2000, 5000])));
  if (Math.random() < .12) items.push(10000);
  rep(rnd(0, 2), () => items.push(pick([100, 200])));
  let c = 0; rep(rnd(0, 3), () => { const v = pick([1, 2, 5, 10, 20, 50]); if (c + v < 100) { c += v; items.push(v); } });
  items.sort((a, b) => b - a);
  return { items, total: items.reduce((a, b) => a + b, 0) };
}
function comboFor(eurosTotal) {
  const out = []; let r = eurosTotal;
  while (r > 0) { const fit = [20, 10, 5, 2, 1].filter(d => d <= r); const d = Math.random() < .7 ? fit[0] : pick(fit.slice(0, 3)); out.push(d * 100); r -= d; }
  return out;
}
function blocksSVG(n) {
  const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10;
  let s = `<svg viewBox="0 0 212 84" class="blk" role="img" aria-label="Bloques de centenas, decenas y unidades">`;
  for (let i = 0; i < h; i++) { const x = (i % 3) * 40, y = Math.floor(i / 3) * 44; s += `<rect x="${x}" y="${y}" width="36" height="36" rx="3" fill="#2e9e5b" stroke="#17643a" stroke-width="2"/><path d="M${x + 12} ${y}v36M${x + 24} ${y}v36M${x} ${y + 12}h36M${x} ${y + 24}h36" stroke="#17643a" stroke-width="1" fill="none"/>`; }
  for (let i = 0; i < t; i++) s += `<rect x="${124 + i * 9.5}" y="0" width="7" height="36" rx="2" fill="#d9534a" stroke="#8f2b24" stroke-width="1"/>`;
  for (let i = 0; i < o; i++) s += `<rect x="${124 + (i % 5) * 10}" y="${46 + Math.floor(i / 5) * 10}" width="7" height="7" rx="1.5" fill="#3c78c8" stroke="#1f4c8a" stroke-width="1"/>`;
  return s + `</svg>`;
}
function rulerSVG(o) {
  const W = narrow() ? 580 : 1000, m = 44, px = (W - 2 * m) / (o.max * 10), X = mm => m + mm * px;
  let s = `<svg viewBox="0 0 ${W} 196" class="nl" role="img" aria-label="Objeto sobre una regla">`;
  s += `<rect x="${X(o.from)}" y="16" width="${(o.to - o.from) * px}" height="44" rx="14" fill="${o.color}"/><text x="${X((o.from + o.to) / 2)}" y="51" text-anchor="middle" font-size="34">${o.emoji}</text>`;
  s += `<path d="M${X(o.from)} 10V92M${X(o.to)} 10V92" stroke="currentColor" stroke-width="2.5" stroke-dasharray="7 6" fill="none"/>`;
  s += `<rect x="${m - 24}" y="92" width="${W - 2 * m + 48}" height="92" rx="8" fill="#ffe28a" stroke="#b98a00" stroke-width="3"/>`;
  for (let i = 0; i <= o.max * 10; i++) {
    const h = i % 10 === 0 ? 36 : i % 5 === 0 ? 25 : 14;
    s += `<line x1="${X(i)}" y1="92" x2="${X(i)}" y2="${92 + h}" stroke="#3b2a05" stroke-width="${i % 10 === 0 ? 3.5 : 2}"/>`;
    if (i % 10 === 0) s += `<text x="${X(i)}" y="170" text-anchor="middle" font-size="${o.max > 9 ? 30 : 36}" font-weight="700" fill="#3b2a05">${i / 10}</text>`;
  }
  return s + `</svg>`;
}
const seqHTML = (arr, holes) => `<div class="seq">${arr.map((v, i) => holes.includes(i) ? '<span class="q">?</span>' : `<span>${v}</span>`).join('')}</div>`;

/* ---------- Generadores de retos ---------- */
function mkChoice(w, tag, prompt, correct, wrongs, extra) {
  const opts = shuffle(uniq([correct, ...wrongs.filter(x => x !== correct)]));
  return { w, tag, kind: 'choice', prompt, opts, ans: opts.indexOf(correct), explain: `La respuesta correcta es <b>${correct}</b>.`, hint: 'Lee otra vez con calma y descarta las que no pueden ser.', ...(extra || {}) };
}
const teoria = (w, tag, pool) => () => { const [p, c, ws, ex] = pick(pool); return mkChoice(w, tag, p, c, ws, ex ? { explain: ex } : null); };

// Isla 1: recta numérica
const T1 = 'Recta numérica · Zahlenstrahl';
function gLeer(kind) {
  kind = kind || pick(['u', 'u', 'd']);
  let start, step, count, t;
  if (kind === 'u') { count = narrow() ? 40 : 60; start = rnd(1, (990 - count) / 10) * 10; step = 1; do { t = rnd(1, count - 1); } while (t % 10 === 0 && Math.random() < .85); }
  else { count = narrow() ? 40 : 50; start = rnd(0, (1000 - count * 10) / 100) * 100; step = 10; do { t = rnd(1, count - 1); } while (t % 10 === 0); }
  const q = { w: 'recta', tag: T1, kind: 'num', start, step, count, labelEvery: 10, target: start + t * step, canHint: true };
  q.prompt = 'Mira dónde empieza, dónde termina y cuánto vale cada rayita. ¿Qué número señala la flecha?';
  q.slots = [{ ans: q.target }];
  q.visual = (q, u) => lineSVG({ ...q, marks: [{ pos: t, color: u.done ? 'var(--ok)' : 'var(--red)', text: u.done ? q.target : undefined }], hops: u.hint && !u.done ? { from: nearestLabel(q), to: t } : null });
  q.hint = `Cada rayita vale ${step}. Cuenta los saltos desde el número más cercano.`;
  const li = nearestLabel(q), lv = start + li * step, k = Math.abs(t - li);
  q.explain = `La flecha señala el <b>${q.target}</b>. Cada rayita vale ${step}: desde el ${lv} hay ${k} rayitas, ${lv} ${t >= li ? '+' : '−'} ${k * step} = ${q.target}.`;
  return q;
}
function gUbicar() {
  const count = narrow() ? 20 : 40, start = rnd(1, (990 - count) / 10) * 10;
  let t; do { t = rnd(1, count - 1); } while (t % 10 === 0);
  const target = start + t, dec = Math.floor(target / 10) * 10;
  return { w: 'recta', tag: T1, kind: 'tap', start, step: 1, count, labelEvery: 10, target, canHint: true,
    prompt: `Toca la rayita donde va el <strong>${target}</strong>.`,
    hint: `Busca primero el ${dec} y luego cuenta ${target - dec} rayitas hacia la derecha.`,
    explain: `El ${target} está ${target - dec} rayitas después del ${dec}.` };
}
function gFalta() {
  const s = pick([2, 5, 10, 10, 50, 100]), a = rnd(1, Math.floor((1000 - 5 * s) / s)) * s, h = rnd(1, 4);
  const arr = rep(6, (_, i) => a + i * s);
  return { w: 'recta', tag: T1, kind: 'num', prompt: 'En la recta todos los saltos son iguales. ¿Qué número falta?', visual: () => seqHTML(arr, [h]), slots: [{ ans: arr[h] }],
    hint: `Mira cuánto hay de un número al siguiente: ${arr[h === 1 ? 2 : 0]} → ${arr[h === 1 ? 3 : 1]}.`,
    explain: `Cada salto vale ${s}. ${arr[h - 1]} + ${s} = <b>${arr[h]}</b>.` };
}
const gRectaT = teoria('recta', T1, [
  ['¿Cuál es verdad sobre la recta numérica?', 'No tiene límite, es infinita', ['Termina en el 100', 'Los números van desordenados', 'Los saltos son de tamaños distintos']],
  ['¿Cómo se ubican los números en la recta numérica?', 'En orden ascendente', ['En orden descendente', 'Sin ningún orden', 'Solo los pares']],
  ['¿Hacia dónde crecen los números en la recta?', 'Hacia la derecha ➡️', ['Hacia la izquierda ⬅️', 'Hacia arriba ⬆️', 'No crecen']],
  ['La recta numérica está separada en…', 'partes iguales', ['partes de cualquier tamaño', 'dos partes', 'colores']],
  ['¿Para qué podemos usar la recta numérica?', 'Para sumar y restar', ['Para medir el tiempo', 'Para pintar', 'Para pesar cosas']],
  ['¿Cómo se dice "recta numérica" en alemán?', 'der Zahlenstrahl', ['die Nachbarzahl', 'das Geld', 'der Zentimeter']]
]);

// Isla 2: comparar
const T2 = 'Comparar · vergleichen';
const sg = a => a === '<' ? '&lt;' : a === '>' ? '&gt;' : '=';
function digitsExplain(a, b, ans) {
  const sa = String(a), sb = String(b), L = Math.max(sa.length, sb.length);
  let diff = -1; if (sa.length === sb.length) for (let i = 0; i < L; i++) if (sa[i] !== sb[i]) { diff = i; break; }
  const row = s => { let r = ''; const pad = L - s.length; for (let i = 0; i < L; i++) { const c = i < pad ? '' : s[i - pad]; r += `<span class="dg${i === diff ? ' hl' : ''}${c === '' ? ' empty' : ''}">${c}</span>`; } return `<div class="dgrow">${r}<span class="dgn">${cifras(s.length)}</span></div>`; };
  let t;
  if (sa.length !== sb.length) t = `${fmt(a)} tiene ${cifras(sa.length)} y ${fmt(b)} tiene ${cifras(sb.length)}. Es mayor el que tiene más cifras: ${fmt(a)} ${sg(ans)} ${fmt(b)}.`;
  else if (diff < 0) t = `Son exactamente iguales: ${fmt(a)} = ${fmt(b)}.`;
  else t = `Tienen las mismas cifras. De izquierda a derecha, la primera cifra distinta es ${sa[diff]} contra ${sb[diff]}, así que ${fmt(a)} ${sg(ans)} ${fmt(b)}.`;
  return t + `<br><div class="dgbox">${row(sa)}${row(sb)}</div>`;
}
const cifras = n => n === 1 ? '1 cifra' : n + ' cifras';
const cmpAns = (a, b) => a > b ? '>' : a < b ? '<' : '=';
function gComp() {
  const num = L => { let s = String(rnd(1, 9)); for (let i = 1; i < L; i++) s += rnd(0, 9); return s; };
  const r = Math.random(); let a, b;
  if (r < .28) { if (Math.random() < .2) { a = num(3); b = '1000'; } else { const L1 = rnd(1, 2); a = num(L1); b = num(L1 + 1); if (Math.random() < .6) { a = '9' + a.slice(1); b = '1' + b.slice(1); } } if (Math.random() < .5) [a, b] = [b, a]; }
  else if (r < .88) { const L = Math.random() < .85 ? 3 : 2, p = pick([0, 1, L - 1, L - 1]); a = num(L); let e; do { e = rnd(p === 0 ? 1 : 0, 9); } while (e === +a[p]); b = a.slice(0, p) + e; for (let i = p + 1; i < L; i++) b += rnd(0, 9); }
  else { a = num(3); b = a; }
  const A = +a, B = +b, ans = cmpAns(A, B);
  return { w: 'comparar', tag: T2, kind: 'comp', prompt: '¿Qué signo va en medio?', L: fmt(A), R: fmt(B), ans,
    hint: a.length !== b.length ? 'Cuenta primero cuántas cifras tiene cada número.' : 'Compara cifra por cifra, empezando por la izquierda.', explain: digitsExplain(A, B, ans) };
}
function expr(n, style) {
  const h = Math.floor(n / 100), t = Math.floor(n % 100 / 10), o = n % 10;
  if (style === 'sum') return [h && h * 100, t && t * 10, o].filter(Boolean).join(' + ');
  if (style === 'hze') return [h && h + 'H', t && t + 'Z', o && o + 'E'].filter(Boolean).join(' + ');
  return String(n);
}
function gCompExpr() {
  const A = rnd(101, 989), r = Math.random(); let b;
  b = r < .2 ? A : r < .6 ? A + pick([-30, -20, -10, 10, 20, 30]) : A + pick([-5, -2, -1, 1, 2, 5]);
  if (b < 100 || b > 999) b = A;
  const st = pick([['sum', 'sum'], ['hze', 'hze'], ['sum', 'plain'], ['plain', 'hze'], ['sum', 'hze']]);
  const ans = cmpAns(A, b);
  return { w: 'comparar', tag: T2, kind: 'comp', prompt: 'Calcula cada lado y elige el signo. <small>H = centenas, Z = decenas, E = unidades</small>', L: expr(A, st[0]), R: expr(b, st[1]), ans,
    hint: 'Primero averigua qué número es cada lado. H vale 100, Z vale 10 y E vale 1.',
    explain: `${expr(A, st[0])} = <b>${A}</b> y ${expr(b, st[1])} = <b>${b}</b>. Entonces ${A} ${sg(ans)} ${b}.` };
}
function gBlocks() {
  const a = rnd(1, 5) * 100 + rnd(0, 9) * 10 + rnd(0, 9); let b = Math.random() < .15 ? a : a + pick([-100, -20, -10, -3, 3, 10, 20, 100]);
  if (b < 100 || b > 699) b = a;
  const ans = cmpAns(a, b);
  return { w: 'comparar', tag: T2, kind: 'comp', prompt: 'Cuenta los bloques: 🟩 = 100, barra roja = 10, cuadrito azul = 1. ¿Qué signo va?', L: blocksSVG(a), R: blocksSVG(b), ans,
    hint: 'Cuenta primero las placas verdes de 100. Si hay las mismas, mira las barras de 10.', explain: `A la izquierda hay <b>${a}</b> y a la derecha <b>${b}</b>: ${a} ${sg(ans)} ${b}.` };
}
function gOrd() {
  const h = rnd(1, 8), set = new Set();
  while (set.size < 4) set.add(Math.random() < .65 ? h * 100 + rnd(0, 99) : rnd(100, 999));
  const asc = Math.random() < .5, items = shuffle([...set]).map(v => ({ v, label: String(v) }));
  return { w: 'comparar', tag: T2, kind: 'ord', prompt: `Ordena de <strong>${asc ? 'menor a mayor' : 'mayor a menor'}</strong>. Toca los números en orden.`, items, asc,
    hint: 'Compara primero las centenas, luego las decenas y al final las unidades.' };
}

// Isla 3: vecinos
const T3 = 'Números vecinos · Nachbarn';
function gVec(kind) {
  let n = rnd(101, 989), lo, hi;
  const K = { zahl: ['Nachbarzahlen', 'los vecinos de uno en uno'], zehner: ['Nachbarzehner', 'las decenas vecinas'], hunderter: ['Nachbarhunderter', 'las centenas vecinas'] }[kind];
  let ex, line;
  if (kind === 'zahl') { lo = n - 1; hi = n + 1; ex = `Los vecinos de ${n} son ${lo} y ${hi}.`; line = { start: n - 2, step: 1, count: 4, labelAll: true }; }

const cur = () => st.qs[st.i];

function render() {

    h += `<div class="signs">${[['>', 'mayor que'], ['<', 'menor que'], ['=', 'igual que']].map(([s, t]) => `<button class="sign" data-sign="${s}" ${u.done || u.wrong.includes(s) ? 'disabled' : ''}><b>${sg(s)}</b><small>${t}</small></button>`).join('')}</div>`;

function judge(ok) {
  const q = cur(), u = st.ui, ex = typeof q.explain === 'function' ? q.explain(q) : (q.explain || (q.kind === 'ord' ? 'El orden correcto es: ' + [...q.items].sort((a, b) => q.asc ? a.v - b.v : b.v - a.v).map(i => i.label).join(q.asc ? ' &lt; ' : ' &gt; ') + '.' : ''));

  if (!pet) body = `<div class="prize">🪵</div><p>Para jugar necesitas una mascota en el hombro. ¡Ella es la que salta!</p><button class="main go" data-act="setup">Elegir mi mascota</button>`;
  else if (S.tokens < 1) body = `<div class="prize">${pet}</div><p>No te quedan fichas 🎟️. Ganas una cada vez que terminas una ronda en una isla o una batalla con el dragón.</p><button class="main go" data-act="home">🗺️ Ir al mapa</button>`;
  else body = `<div class="prize">${pet}</div><ul class="rules"><li>Tu mascota salta sola. Tú la mueves con ◀ y ▶.</li><li>Atrapa todas las ⭐ que puedas.</li><li>Cada 5 segundos una tablita se pone roja, tiembla y se cae.</li><li>Si caes a la lava, rebotas pero pierdes 1 ⭐.</li><li>Al minuto se caen todas las tablitas y termina el juego.</li></ul><button class="main go" data-act="miniplay">▶ Jugar · usa 1 🎟️</button>`;
  $('#mini').innerHTML = `<div class="bar"><button class="back" data-act="home">← Mapa</button><h2>🪵 Salto de Tablitas</h2><span class="pill">🎟️ ${S.tokens}</span></div><div class="res">${body}${S.miniBest ? `<p>Tu récord: <b>${S.miniBest} ⭐</b></p>` : ''}</div>`;
}
function startMini() {
  S.tokens--; save();
  $('#mini').innerHTML = `<div class="bar"><button class="back" data-act="minibye">✕ Salir</button><h2>🪵 Salto de Tablitas</h2></div>
    <div class="mhud"><span class="pill" id="mT">⏱ 60</span><span class="pill" id="mS">⭐ 0</span></div>
    <canvas id="mC" width="360" height="440" aria-label="Juego de saltar tablitas"></canvas>
    <div class="mctl"><button class="k" data-dir="-1" aria-label="Mover a la izquierda">◀</button><button class="k" data-dir="1" aria-label="Mover a la derecha">▶</button></div>`;
  const c = $('#mC'), dpr = Math.min(2, window.devicePixelRatio || 1), W = 360, H = 440;
  c.width = W * dpr; c.height = H * dpr;
  const ctx = c.getContext('2d'); ctx.scale(dpr, dpr);
  const planks = [385, 310, 235, 160, 85].map(y => ({ x: rnd(10, W - 90), y, y0: y, w: 80, st: 'ok', t: 1, vy: 0 }));
  planks[0].x = 140;
  MG = { ctx, W, H, planks, pet: { x: 180, y: planks[0].y - 14, vx: 0, vy: -620 }, dir: 0, t: 0, next: 5, score: 0, hot: 0, star: null, over: 0, endT: 0, emoji: profile.pet, last: performance.now() };
  placeStar();
  MG.raf = requestAnimationFrame(miniLoop);
}
function placeStar() { const ok = MG.planks.filter(p => p.st === 'ok' && Math.abs(p.y0 - MG.pet.y) > 60); const p = pick(ok.length ? ok : MG.planks); MG.star = { x: p.x + p.w / 2, y: p.y0 - 34 }; }
function miniLoop(now) {
  const g = MG; if (!g) return;
  const dt = Math.min(.033, Math.max(0, (now - g.last) / 1000)); g.last = now;
  if (!g.over) g.t += dt;
  if (!g.over && g.t >= 60) { g.over = 1; g.planks.forEach(p => { if (p.st !== 'gone') p.st = 'fall'; }); sfx('win'); }
  if (!g.over && g.t >= g.next) { g.next += 5; shuffle(g.planks.filter(p => p.st === 'ok')).slice(0, g.t > 30 ? 2 : 1).forEach(p => { p.st = 'shake'; p.t = 0; }); }
  for (const p of g.planks) {
    p.t += dt;
    if (p.st === 'shake' && p.t > 1) { p.st = 'fall'; p.vy = 0; }
    if (p.st === 'fall') { p.vy += 900 * dt; p.y += p.vy * dt; if (p.y > g.H + 40 && !g.over) { p.st = 'gone'; p.t = 0; } }
    if (p.st === 'gone' && p.t > 1.5 && !g.over) { p.st = 'ok'; p.y = p.y0; p.vy = 0; p.x = rnd(10, g.W - 90); p.t = 0; }
  }
  const a = g.pet, py = a.y;
  a.vx = g.dir * 210; a.vy += 1400 * dt; a.x += a.vx * dt; a.y += a.vy * dt;
  if (a.x < -12) a.x = g.W + 12; if (a.x > g.W + 12) a.x = -12;
  if (a.vy > 0 && !g.over) for (const p of g.planks) if ((p.st === 'ok' || p.st === 'shake') && a.x > p.x - 10 && a.x < p.x + p.w + 10 && py + 14 <= p.y + 2 && a.y + 14 >= p.y) { a.y = p.y - 14; a.vy = -620; break; }
  if (!g.over && g.star && Math.abs(a.x - g.star.x) < 26 && Math.abs(a.y - g.star.y) < 28) { g.score++; sfx('ok'); placeStar(); }
  if (a.y > g.H - 28 && a.vy > 0 && !g.over) { a.y = g.H - 28; a.vy = -880; g.hot = .9; if (g.score > 0) g.score--; sfx('bad'); }
  if (g.hot > 0) g.hot -= dt;
  if (g.over) { g.endT += dt; if (g.endT > 1.8) { endMini(); return; } }
  drawMini();
  $('#mT').textContent = '⏱ ' + Math.max(0, Math.ceil(60 - g.t));
  $('#mS').textContent = '⭐ ' + g.score;
  g.raf = requestAnimationFrame(miniLoop);
}
function drawMini() {
  const g = MG, c = g.ctx;
  const sky = c.createLinearGradient(0, 0, 0, g.H); sky.addColorStop(0, '#8fd3f4'); sky.addColorStop(1, '#e0f7fa');
  c.fillStyle = sky; c.fillRect(0, 0, g.W, g.H);
  c.fillStyle = 'rgba(255,255,255,.8)';
  [[50, 60], [240, 130], [120, 270]].forEach(([x, y]) => { c.beginPath(); c.arc(x, y, 16, 0, 7); c.arc(x + 20, y - 8, 20, 0, 7); c.arc(x + 42, y, 16, 0, 7); c.fill(); });
  c.fillStyle = '#ff7043'; c.fillRect(0, g.H - 16, g.W, 16);
  c.fillStyle = '#ffab40'; for (let x = 0; x < g.W; x += 24) { c.beginPath(); c.arc(x + 12 + Math.sin(g.t * 3 + x) * 3, g.H - 16, 9, Math.PI, 0); c.fill(); }
  for (const p of g.planks) {
    if (p.st === 'gone') continue;
    const sh = p.st === 'shake' ? Math.sin(p.t * 50) * 3 : 0;
    c.globalAlpha = p.st === 'ok' && p.t < .4 ? p.t / .4 : 1;
    c.fillStyle = p.st === 'shake' ? '#e2432a' : '#a8703a';
    c.beginPath(); if (c.roundRect) c.roundRect(p.x + sh, p.y, p.w, 12, 5); else c.rect(p.x + sh, p.y, p.w, 12); c.fill();
    c.fillStyle = 'rgba(255,255,255,.28)'; c.fillRect(p.x + sh + 6, p.y + 2, p.w - 12, 3);
    c.globalAlpha = 1;
  }
  c.textAlign = 'center'; c.textBaseline = 'middle';
  if (g.star && !g.over) { c.font = '26px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif'; c.fillText('⭐', g.star.x, g.star.y + Math.sin(g.t * 4) * 3); }
  c.font = '34px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif'; c.fillText(g.emoji, g.pet.x, g.pet.y);
  if (g.hot > 0) { c.font = '22px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",serif'; c.fillText('🔥', g.pet.x, g.pet.y + 24); c.font = '800 18px sans-serif'; c.fillStyle = '#c2321c'; c.fillText('−1 ⭐', g.pet.x, g.pet.y - 28); }
  if (g.over === 1) { c.font = '800 36px sans-serif'; c.fillStyle = '#14304a'; c.fillText('¡Tiempo!', g.W / 2, g.H / 2); }
}
function endMini() {
  const g = MG; stopMini();
  const coins = Math.min(10, g.score), rec = g.score > (S.miniBest || 0);
  S.coins += coins; if (rec) S.miniBest = g.score; save();
  if (rec) confetti(['⭐', g.emoji]);
  $('#mini').innerHTML = `<div class="res"><div class="prize">${g.emoji}</div><h1>¡Se acabó el minuto!</h1><div class="score">${g.score} ⭐</div>
    <p>${rec ? '¡Nuevo récord! ' : ''}Ganaste <b>${coins} 🪙</b>. ${S.tokens > 0 ? `Te quedan ${S.tokens} 🎟️.` : 'Para volver a jugar, gana otra ficha terminando una ronda.'}</p>
    <div class="resbtns"><button class="main alt" data-act="home">🗺️ Mapa</button>${S.tokens > 0 ? '<button class="main go" data-act="miniplay">Jugar otra vez</button>' : ''}</div></div>`;
}
document.addEventListener('pointerdown', e => {
  if (!MG) return;
  const b = e.target.closest('[data-dir]');
  if (b) { MG.dir = +b.dataset.dir; e.preventDefault(); }
  else if (e.target.id === 'mC') { const r = e.target.getBoundingClientRect(); MG.dir = e.clientX < r.left + r.width / 2 ? -1 : 1; e.preventDefault(); }
});
['pointerup', 'pointercancel'].forEach(ev => document.addEventListener(ev, () => { if (MG) MG.dir = 0; }));
document.addEventListener('keydown', e => { if (!MG) return; if (e.key === 'ArrowLeft') { MG.dir = -1; e.preventDefault(); } if (e.key === 'ArrowRight') { MG.dir = 1; e.preventDefault(); } });
document.addEventListener('keyup', e => { if (MG && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) MG.dir = 0; });

/* ---------- Entrada ---------- */
document.addEventListener('click', e => {
  const t = e.target.closest('button, .hit'); if (!t) return;
  const d = t.dataset;
  if (d.world) return showWorld(d.world);
  if (d.play) return startWorld(d.play);
  if (d.boss) return startBoss();
  if (d.opt) { draft[d.opt] = d.val; renderSetup(); return; }
  switch (d.act) {
    case 'quit': if (t.dataset.armed) { delete t.dataset.armed; t.textContent = '✕ Salir'; return showHome(); } t.dataset.armed = '1'; t.textContent = '¿Salir? Toca otra vez'; setTimeout(() => { delete t.dataset.armed; t.textContent = '✕ Salir'; }, 3000); return;
    case 'home': return showHome();
    case 'setup': return showSetup();
    case 'save': return saveProfile();
    case 'random': draft = randomProfile($('#nameIn').value); renderSetup(); return;
    case 'check': if (st) action(); return;
    case 'mini': case 'minibye': return showMini();
    case 'miniplay': return S.tokens > 0 ? startMini() : showMini();
    case 'album': return showAlbum();
    case 'sound': S.sound = !S.sound; save(); showHome(); sfx('ok'); return;
    case 'joke': $('#bubble').textContent = pick(JOKES); return;
    case 'chest': return openChest($('#chestBox'));
    case 'buy':
      if (S.coins < 30) return showAlbum('<p><b>Te faltan monedas. Juega una isla para ganar más. 🪙</b></p>');
      S.coins -= 30; save(); showAlbum(); return openChest($('#chestBox'));
  }
  if (!st || $('#play').classList.contains('hidden')) return;
  const u = st.ui, q = cur();
  if (d.key) typeKey(d.key);
  else if (d.slot !== undefined) { u.active = +d.slot; render(); }
  else if (d.nudge && u.placed !== null && !u.done) { u.placed = Math.max(0, Math.min(q.count, u.placed + +d.nudge)); render(); }
  else if (d.act === 'hint') { u.hint = true; u.hinted = true; u.fb = typeof q.hint === 'function' ? q.hint(q, u) : q.hint; u.fbk = 'hint'; render(); }
  else if (d.sign && !u.done) { u.pick = d.sign; if (d.sign !== q.ans) u.wrong.push(d.sign); judge(d.sign === q.ans); }
  else if (d.optI !== undefined && !u.done) { const i = +d.optI; if (i !== q.ans) u.wrong.push(i); judge(i === q.ans); }
  else if (d.chip !== undefined) { if (u.ord.length < q.items.length) u.ord.push(+d.chip); render(); }
  else if (d.oslot !== undefined) { const i = +d.oslot; if (u.ord[i] !== undefined) { u.ord.splice(i, 1); render(); } }
});
document.addEventListener('pointerdown', e => {
  const hit = e.target.closest('.hit'); if (!hit || !st) return;
  const q = cur(); if (q.kind !== 'tap' || st.ui.done) return;
  const r = hit.ownerSVGElement.getBoundingClientRect(), xv = (e.clientX - r.left) / r.width * 1000, dx = (1000 - 92) / q.count;
  st.ui.placed = Math.max(0, Math.min(q.count, Math.round((xv - 46) / dx)));
  render();
});
$('#mainBtn').addEventListener('click', action);
document.addEventListener('keydown', e => {
  if (!st || $('#play').classList.contains('hidden')) return;
  const q = cur();
  if (/^[0-9]$/.test(e.key)) typeKey(e.key);
  else if (e.key === ',' || e.key === '.') typeKey(',');
  else if (e.key === 'Backspace') typeKey('del');
  else if (e.key === 'Tab' && q.kind === 'num' && q.slots.length > 1) { e.preventDefault(); typeKey('tab'); }
  else if (e.key === 'Enter') { e.preventDefault(); if (!$('#mainBtn').classList.contains('hidden')) action(); }
});
showHome();
</script>
</body>
